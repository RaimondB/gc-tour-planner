name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # On-demand: lets the (otherwise main-only) integration job run against any
  # branch — e.g. before cutting a UAT version from a feature branch.
  workflow_dispatch:

# Least privilege: every job only checks out and runs checks — none write to the
# repo, comment, or publish. Restrict the default GITHUB_TOKEN accordingly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm licenses:check

  # Markdown is no longer Prettier-formatted (it's hand-authored prose), so the
  # check that matters for our heavily cross-linked docs/ADRs is link integrity,
  # not byte-formatting. lychee runs OFFLINE: it verifies every relative link and
  # in-page #anchor between Markdown files resolves to a real path/heading, and
  # skips external URLs (those are non-deterministic and would make CI flaky —
  # the opposite of what we want from a required gate). No pnpm install needed;
  # --exclude-path keeps it correct even if node_modules/dist happen to exist.
  docs-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown cross-links (offline — local paths + anchors)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            --exclude-path node_modules
            --exclude-path dist
            --exclude-path .turbo
            './**/*.md'
          fail: true

  # Testcontainers integration suite (real PostGIS). Heavier + Docker-bound, so
  # it is NOT a per-PR gate: it runs on merges to main (the pre-UAT point) and
  # on manual dispatch. Keep it out of branch-protection's required checks so it
  # stays optional; treat a red run here as "don't promote to UAT yet".
  integration:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      # The integration specs import built workspace packages (@gctp/db,
      # @gctp/shared subpaths), so those must be compiled before vitest resolves
      # them — otherwise: "Failed to resolve entry for package @gctp/db". (api
      # itself runs from TS source via vitest, so only its deps need building.)
      - run: pnpm --filter @gctp/db --filter @gctp/shared build
      # Testcontainers talks to the runner's Docker daemon (preinstalled on
      # ubuntu-latest) and boots its own PostGIS per spec file.
      - run: pnpm --filter @gctp/api test:integration
