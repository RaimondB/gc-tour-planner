<!-- Maskable variant of the gc-tour-planner brand mark. SOURCE OF TRUTH for
     pwa-maskable-512.png. Render once, locally, and commit:
       rsvg-convert -w 512 -h 512 icon-maskable.svg -o pwa-maskable-512.png
     Full-bleed: the quadrant colours reach every edge, so Android's
     circle/squircle adaptive mask rounds off solid colour only. The G/C/T/P
     glyphs sit at the quadrant centres, comfortably inside the central-80%
     maskable safe zone, so the mask never crops them — and the result fills the
     launcher tile like a native icon instead of floating a small monogram on a
     white card. Matches icon-source.svg so the home-screen icon looks the same
     whichever purpose the launcher picks. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="512" height="512">
  <rect x="0" y="0" width="20" height="20" fill="#d84315" />
  <rect x="20" y="0" width="20" height="20" fill="#bf360c" />
  <rect x="0" y="20" width="20" height="20" fill="#bf360c" />
  <rect x="20" y="20" width="20" height="20" fill="#16a34a" />
  <line x1="20" y1="0" x2="20" y2="40" stroke="#fff" stroke-width="1.6" />
  <line x1="0" y1="20" x2="40" y2="20" stroke="#fff" stroke-width="1.6" />
  <g fill="#fff" font-family="DejaVu Sans, Verdana, system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">
    <text x="14" y="17.5">G</text>
    <text x="26" y="17.5">C</text>
    <text x="14" y="29.5">T</text>
    <text x="26" y="29.5">P</text>
  </g>
</svg>
