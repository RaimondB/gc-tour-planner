<!-- gc-tour-planner brand mark — DISPLAY variant (shown IN FULL): the splash
     screen and any launcher that doesn't apply its own mask. SOURCE OF TRUTH for
     pwa-192.png and pwa-512.png (manifest `purpose: "any"`). Render once, locally,
     and commit (no build-time step):
       rsvg-convert -w 512 -h 512 icon-source.svg -o pwa-512.png
       rsvg-convert -w 192 -h 192 icon-source.svg -o pwa-192.png
     ROUNDED TILE on purpose: a small inset + rounded corners make it read as a
     tidy app tile on the white splash, instead of a hard full-bleed square. This
     is the counterpart to icon-maskable.svg, which is FULL-BLEED for the cropped
     home-screen icon (and now also renders apple-touch-icon.png). Modern Chrome
     uses the maskable icon for the launcher when present, so this `any` icon is
     only ever shown unmasked — hence rounding it here is safe. The G/C/T/P glyphs
     sit at the quadrant centres, well inside the mask safe zone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="512" height="512">
  <defs>
    <clipPath id="tile">
      <rect x="1.5" y="1.5" width="37" height="37" rx="8" />
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="20" height="20" fill="#d84315" />
    <rect x="20" y="0" width="20" height="20" fill="#bf360c" />
    <rect x="0" y="20" width="20" height="20" fill="#bf360c" />
    <rect x="20" y="20" width="20" height="20" fill="#16a34a" />
    <line x1="20" y1="0" x2="20" y2="40" stroke="#fff" stroke-width="1.6" />
    <line x1="0" y1="20" x2="40" y2="20" stroke="#fff" stroke-width="1.6" />
    <g fill="#fff" font-family="DejaVu Sans, Verdana, system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">
      <text x="14" y="17.5">G</text>
      <text x="26" y="17.5">C</text>
      <text x="14" y="29.5">T</text>
      <text x="26" y="29.5">P</text>
    </g>
  </g>
</svg>
