<!-- UAT badge of the DISPLAY (shown-in-full) brand mark: splash + non-masking
     launchers. SOURCE OF TRUTH for pwa-192-uat.png and pwa-512-uat.png. Render
     once, locally, and commit:
       rsvg-convert -w 512 -h 512 icon-source-uat.svg -o pwa-512-uat.png
       rsvg-convert -w 192 -h 192 icon-source-uat.svg -o pwa-192-uat.png
     Identical to icon-source.svg (rounded tile) plus a centred dark "UAT" pill.
     UAT only — prod uses the clean mark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="512" height="512">
  <defs>
    <clipPath id="tile">
      <rect x="1.5" y="1.5" width="37" height="37" rx="8" />
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="20" height="20" fill="#d84315" />
    <rect x="20" y="0" width="20" height="20" fill="#bf360c" />
    <rect x="0" y="20" width="20" height="20" fill="#bf360c" />
    <rect x="20" y="20" width="20" height="20" fill="#16a34a" />
    <line x1="20" y1="0" x2="20" y2="40" stroke="#fff" stroke-width="1.6" />
    <line x1="0" y1="20" x2="40" y2="20" stroke="#fff" stroke-width="1.6" />
    <g fill="#fff" font-family="DejaVu Sans, Verdana, system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">
      <text x="14" y="17.5">G</text>
      <text x="26" y="17.5">C</text>
      <text x="14" y="29.5">T</text>
      <text x="26" y="29.5">P</text>
    </g>
  </g>
  <rect x="8" y="15.5" width="24" height="9" rx="4.5" fill="#111827" stroke="#fff" stroke-width="0.5" />
  <text x="20" y="22.1" fill="#fff" font-family="DejaVu Sans, Verdana, system-ui, sans-serif" font-weight="700" font-size="6.2" letter-spacing="0.5" text-anchor="middle">UAT</text>
</svg>
