#
# Full local stack for gc-tour-planner.
#
#   cp .env.example .env
#   docker compose up --build
#
# First boot preprocesses an OSRM extract for OSRM_REGION (~10 min for a
# country-sized region). Subsequent boots reuse the contracted graph in the
# osrm-data volume.

name: gctp

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    ports:
      - "${VALKEY_PORT}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  osrm:
    # ghcr.io/project-osrm/osrm-backend is the actively-maintained image
    # (Alpine 3.21 base, has wget). The old osrm/osrm-backend on Docker Hub
    # was abandoned in 2021 — Debian 9 stretch (EOL), no HTTP client,
    # apt mirrors return 404. Don't switch back without a very good reason.
    image: ghcr.io/project-osrm/osrm-backend:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/srv/bootstrap.sh"]
    environment:
      OSRM_REGION: ${OSRM_REGION}
    volumes:
      - ./osrm/bootstrap.sh:/srv/bootstrap.sh:ro
      - osrm-data:/data
    ports:
      - "${OSRM_PORT}:5000"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3030
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL}
      OSRM_URL: ${OSRM_URL}
      OVERPASS_URL: ${OVERPASS_URL}
      JWT_SECRET: ${JWT_SECRET}
      TOUR_PLANNER: ${TOUR_PLANNER}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${API_PORT}:3030"

  jobs:
    build:
      context: ..
      dockerfile: infra/Dockerfile.jobs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL}
      OVERPASS_URL: ${OVERPASS_URL}
      LOG_LEVEL: ${LOG_LEVEL}

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:80"

volumes:
  pgdata: {}
  valkey-data: {}
  osrm-data: {}
