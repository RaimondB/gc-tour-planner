#
# Full local stack for gc-tour-planner.
#
#   cp .env.example .env
#   docker compose up --build
#
# First boot preprocesses an OSRM extract for OSRM_REGION (~10 min for a
# country-sized region). Subsequent boots reuse the contracted graph in the
# osrm-data volume.

name: gctp

# Networking (ADR-0015):
#   - `default` (compose-generated `gctp_default`): the ONLY network. postgres,
#     valkey, osrm, solver, jobs, api, web and the dedicated cloudflared all
#     live here and nowhere else. gctp deliberately no longer joins any shared
#     reverse-proxy network — no other workload on the host can reach gctp's
#     (pre-auth) API. The only ingress is the
#     cloudflared tunnel below; this bridge still has egress (NAT) so
#     cloudflared can dial out to the Cloudflare edge.
networks:
  default:

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    # Host is a shared 16 GiB host; every gctp service is capped so a runaway
    # cannot trigger a global OOM and take down the SSH/VSCode session or
    # neighbour stacks (homeassistant, photoprism, …). memswap_limit == mem_limit
    # disables swap for the container — predictable kill instead of swap thrash.
    mem_limit: 2g
    memswap_limit: 2g
    # Docker's default container /dev/shm is 64 MiB. Postgres parallel
    # workers use POSIX shm for cross-worker hash tables, sort buffers
    # and gather nodes — at the 64 MiB default any non-trivial parallel
    # plan over PostGIS data hits "could not resize shared memory
    # segment ... No space left on device". 1 GiB is well above the
    # high-water mark we've seen on the planner's biggest queries and
    # still inside the 2 GiB mem_limit.
    shm_size: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot DB migration runner. Runs node-pg-migrate against the
  # `pgmigrations` table (idempotent — no-op when nothing pending) and
  # exits 0. Every postgres-writing service below depends on this with
  # `service_completed_successfully`, so `docker compose up --build -d`
  # is now a self-applying deploy: pull, build, up — no separate manual
  # migrate step on the host. See docs/sdlc/release-and-deploy.md and
  # docs/sdlc/migrations.md.
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Same DSN the api uses — node-pg-migrate reads DATABASE_URL.
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      # Bind-mount the repo's migrations directory read-only. Each
      # `git pull` + `docker compose up --build` picks up new files
      # without a fresh image build.
      - ../packages/db/migrations:/migrations:ro

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    ports:
      - "${VALKEY_PORT}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot OSM PBF prep: downloads each region's extract from Geofabrik
  # and (for multi-region setups) merges them with `osmium merge` so the
  # foot graph is contiguous across borders. Lives in a Debian-based image
  # because osmium-tool isn't packaged in alpine.
  #
  # On second + subsequent boots the prep script sees the target PBF
  # already present on the shared volume and exits in well under a second.
  osm-prep:
    image: debian:bookworm-slim
    restart: "no"
    # `osmium merge` can spike a couple of GiB on multi-region setups; 2 GiB
    # is plenty for single-region (the common case) and bounds the worst case.
    mem_limit: 2g
    memswap_limit: 2g
    entrypoint: ["/bin/sh", "/srv/prep.sh"]
    environment:
      OSRM_REGION: ${OSRM_REGION:-}
      OSRM_REGIONS: ${OSRM_REGIONS:-}
    volumes:
      - ./osrm/prep.sh:/srv/prep.sh:ro
      - osrm-data:/data

  osrm:
    # ghcr.io/project-osrm/osrm-backend is the actively-maintained image
    # (Alpine 3.21 base, has wget). The old osrm/osrm-backend on Docker Hub
    # was abandoned in 2021 — Debian 9 stretch (EOL), no HTTP client,
    # apt mirrors return 404. Don't switch back without a very good reason.
    image: ghcr.io/project-osrm/osrm-backend:latest
    restart: unless-stopped
    # NL-foot extract peaks at ~5-6 GiB; NL + Nordrhein-Westfalen merged
    # peaks at ~8-9 GiB (measured: cgroup OOM'd at exactly 8 GiB during
    # "Writing nodes for nodes-based and edges-based graphs"). 12 GiB
    # comfortably covers the multi-region extract phase; partition /
    # customize / routed themselves sit much lower. memswap_limit raised
    # in step so the kernel can spill the bursty extract phase to swap
    # (16 GiB host swap, prio=10 — see ADR-0009 ops notes).
    mem_limit: 12g
    memswap_limit: 14g
    entrypoint: ["/bin/sh", "/srv/bootstrap.sh"]
    environment:
      # Pass both — bootstrap picks OSRM_REGIONS when set, else OSRM_REGION.
      # Empty-string default keeps compose happy if only one is defined.
      OSRM_REGION: ${OSRM_REGION:-}
      OSRM_REGIONS: ${OSRM_REGIONS:-}
      OSRM_MAX_TABLE_SIZE: ${OSRM_MAX_TABLE_SIZE:-5000}
      # Worker thread count for osrm-routed. Bound to physical cores by
      # default to leave HT headroom for the rest of the stack; raise
      # for higher single-tenant throughput, lower if OSRM is starving
      # postgres / api under load.
      OSRM_THREADS: ${OSRM_THREADS:-4}
    volumes:
      - ./osrm/bootstrap.sh:/srv/bootstrap.sh:ro
      # Custom foot profile (ADR-0013): walkable cycleways. Mounted next to the
      # stock profile + lib/ so its loadfile()/require('lib/..') resolve in /opt.
      - ./osrm/foot-gctp.lua:/opt/foot-gctp.lua:ro
      - osrm-data:/data
    ports:
      - "${OSRM_PORT}:5000"
    depends_on:
      # Block startup until osm-prep has the (merged) PBF on the volume.
      # `service_completed_successfully` is exactly what we want: the prep
      # container exits 0, and OSRM proceeds.
      osm-prep:
        condition: service_completed_successfully

  # One-shot landuse import (ADR-0009). Reads the shared OSRM PBF via the
  # osrm-data volume and populates `landuse_polygons` + `landuse_import_meta`
  # via osm2pgsql with a flex-output Lua filter. Exits 0 on success;
  # subsequent boots short-circuit on the metadata row in ~2 s.
  #
  # Replaces ADR-0008's Overpass sidecar — same data (landuse polygons),
  # smaller footprint (no permanent dispatcher; uses the existing
  # Postgres), more deterministic memory profile (~1.5-2 GB peak).
  osm2pgsql-import:
    build:
      context: ./osm2pgsql
      dockerfile: Dockerfile
    restart: "no"
    # Peak observed during NL import with --slim --drop --flat-nodes
    # --cache 256 is ~1.5-2 GiB. Multi-region setups (e.g.
    # NL + NRW = 2× the ways) scale linearly; 5 GiB cap covers that
    # comfortably, and the host has 16 GiB of swap as the safety net
    # if a flush spikes higher.
    mem_limit: 5g
    memswap_limit: 8g
    depends_on:
      # PBF must exist on the osrm-data volume — same dep as the (removed)
      # overpass service used to have.
      osm-prep:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # osm2pgsql writes into landuse_polygons + parking_facilities —
      # both schemas need to exist before this runs.
      migrate:
        condition: service_completed_successfully
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DATABASE: ${POSTGRES_DB}
      OSRM_REGION: ${OSRM_REGION:-}
      OSRM_REGIONS: ${OSRM_REGIONS:-}
      # Set to 1 to force a full re-import even if landuse_import_meta is
      # already populated. Used by the admin /admin/landuse/reimport
      # endpoint (which restarts this service) and by operators.
      LANDUSE_FORCE_REIMPORT: ${LANDUSE_FORCE_REIMPORT:-}
      # Tuneable osm2pgsql knobs — defaults are memory-safe on the host.
      # Bump OSM2PGSQL_CACHE to 1024+ to trade RAM for faster import; bump
      # OSM2PGSQL_PROCESSES to use hyperthreads. See PLANNER_TUNING.md.
      OSM2PGSQL_CACHE: ${OSM2PGSQL_CACHE:-256}
      OSM2PGSQL_PROCESSES: ${OSM2PGSQL_PROCESSES:-4}
      OSM2PGSQL_EXTRA: ${OSM2PGSQL_EXTRA:-}
      # --flat-nodes allocates a node-index file sized by the GLOBAL max OSM
      # node id (~90+ GB), not by the extract. Default on; set to 0 on a
      # small-disk host so a regional import doesn't run out of space.
      OSM2PGSQL_FLAT_NODES: ${OSM2PGSQL_FLAT_NODES:-1}
    volumes:
      # PBF source — read-only.
      - osrm-data:/osrm-data:ro
      # Persistent flat-nodes file so osm2pgsql-replication can find the
      # same node-id → location mapping across runs. ~150 MB for NL.
      - osm2pgsql-data:/var/lib/osm2pgsql

  # Timefold sidecar (ADR-0005). Always boots so the dependency below stays
  # unconditional — compose v2 has no syntax for "depends_on only when
  # TOUR_PLANNER=solver". Spring Boot startup is a few seconds; the api still
  # starts well before user-facing requests when TOUR_PLANNER=greedy.
  solver:
    build:
      context: ./solver
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      SOLVER_SPENT_LIMIT: ${SOLVER_SPENT_LIMIT:-5s}
    ports:
      - "${SOLVER_PORT:-8088}:8080"
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'wget -qO- http://localhost:8080/actuator/health | grep -q ''"status":"UP"'' || exit 1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    # 1 GiB was tight: a province-wide /landuse response (post-LOD-relax
    # for the viewport-following layer) used to push Node V8 over the
    # default ~750 MiB old-space and crash with "Reached heap limit". 2 GiB
    # gives comfortable headroom for the LIMIT-5000 worst case and the
    # planner's matrices that also live in-process briefly.
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      solver:
        condition: service_healthy
      # Schema must be at the latest revision before api boots — the
      # Kysely types it ships with assume it.
      migrate:
        condition: service_completed_successfully
      # Landuse import is one-shot. The api can boot in parallel with the
      # import — the /landuse endpoint will return empty rows until the
      # import completes (~30-40 min on first boot only). Cluster scoring
      # treats missing landuse as "no preference match", so the planner
      # stays usable throughout.
      osm2pgsql-import:
        condition: service_started
    networks:
      - default
    # No published ports and no reverse-proxy labels: the api is reachable
    # only from inside gctp's own network. The web nginx proxies same-origin
    # `/api/*` to this container (port 3000), stripping the `/api` prefix.
    # The public edge is the cloudflared tunnel in front of web (ADR-0015).
    environment:
      # `uat` (not `production`): the auth config refuses AUTH_DEV_BYPASS under
      # NODE_ENV=production as a safety guard. UAT is an internal, single-tester
      # environment. As of M6-β the login UI ships, so the dev bypass is gone and
      # UAT establishes sessions through real sign-in (self-service register /
      # password login / Google OAuth). Set AUTH_SESSION_SECRET in the env to
      # harden session/OAuth-state signing; flip NODE_ENV to `production` (which
      # makes that secret + Secure cookies mandatory) once UAT graduates.
      NODE_ENV: uat
      # Container-internal port. Matches `EXPOSE 3000` in Dockerfile.api and
      # the port the web nginx proxies /api to.
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL}
      OSRM_URL: ${OSRM_URL}
      OSRM_MAX_CONCURRENCY: ${OSRM_MAX_CONCURRENCY:-8}
      # the web nginx strips /api before forwarding, but bull-board needs the
      # public URL path to bake correct asset URLs. See
      # apps/api/src/main.ts for the rationale.
      BULL_BOARD_BASE_PATH: ${BULL_BOARD_BASE_PATH:-/api/admin/queues}
      # Auth (M6, ADR-0021). Session secret signs the OAuth state; OAUTH_* are
      # optional (the /auth/google routes 503 when unset). Keep real values in
      # infra/.env, never in the repo.
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-2592000}
      # Real-client-IP resolution behind nginx + the CF tunnel (FR-P9 rate
      # limiting). See infra/.env.example for the full rationale. Trust the
      # nginx hop, and trust CF-Connecting-IP while the tunnel is the only ingress.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:-1}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GOOGLE_REDIRECT_URI: ${OAUTH_GOOGLE_REDIRECT_URI:-}
      OAUTH_POST_LOGIN_REDIRECT: ${OAUTH_POST_LOGIN_REDIRECT:-/}
      # Cloudflare Turnstile captcha on /auth/register (FR-P5, Gate 1.4). Unset =
      # open registration; set (with VITE_TURNSTILE_SITE_KEY) before removing Access.
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TOUR_PLANNER: ${TOUR_PLANNER}
      SOLVER_URL: ${SOLVER_URL:-http://solver:8080}
      LOG_LEVEL: ${LOG_LEVEL}
      # CORS: web bundle is served from app.example.com; api requests
      # cross the origin boundary, so the allowed-origins list must be set.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.example.com}
      # OSRM extract version file. The osrm container writes this after
      # `osrm-customize`; the api mounts the volume RO and reads on every
      # plan to filter stale rows from `route_legs`.
      OSRM_VERSION_FILE: /osrm-meta/osrm-version.txt

      # ─── Cluster discovery (Pass 1) ─────────────────────────────────────
      PLANNER_CLUSTERING: ${PLANNER_CLUSTERING:-louvain}
      PLANNER_KNN_K: ${PLANNER_KNN_K:-12}

      # ─── Loop-aware leg picker (Pass 2 polyline assembly) ───────────────
      # See apps/api/src/tours/strategies/greedy/loop-aware-legs.ts.
      PLANNER_LOOP_ALPHA: ${PLANNER_LOOP_ALPHA:-1.0}
      PLANNER_LOOP_GRID_M: ${PLANNER_LOOP_GRID_M:-25}
      PLANNER_LOOP_MAX_DETOUR: ${PLANNER_LOOP_MAX_DETOUR:-0.5}
      PLANNER_LOOP_ALT_COUNT: ${PLANNER_LOOP_ALT_COUNT:-2}
      # Via-waypoint nudge fallback when OSRM doesn't return useful alts.
      PLANNER_LOOP_NUDGE_THRESHOLD: ${PLANNER_LOOP_NUDGE_THRESHOLD:-0.3}
      PLANNER_LOOP_NUDGE_OFFSETS_M: ${PLANNER_LOOP_NUDGE_OFFSETS_M:-80,160}
      PLANNER_LOOP_NUDGE_FRACTIONS: ${PLANNER_LOOP_NUDGE_FRACTIONS:-0.5}
      # Severe-overlap relaxation: widen detour cap when primary retraces.
      PLANNER_LOOP_SEVERE_OVERLAP: ${PLANNER_LOOP_SEVERE_OVERLAP:-0.5}
      PLANNER_LOOP_SEVERE_MAX_DETOUR: ${PLANNER_LOOP_SEVERE_MAX_DETOUR:-1.5}

      # ─── Marginal-cost trim (Pass 2 post-process) ───────────────────────
      # See apps/api/src/tours/strategies/greedy/marginal-trim.ts and
      # docs/PLANNER_TUNING.md for the full rationale.
      PLANNER_MARGINAL_DROP_ENABLED: ${PLANNER_MARGINAL_DROP_ENABLED:-true}
      PLANNER_MARGINAL_DROP_RATIO: ${PLANNER_MARGINAL_DROP_RATIO:-2.0}
      PLANNER_MARGINAL_DROP_ABS_M: ${PLANNER_MARGINAL_DROP_ABS_M:-500}
      # Hard ceiling on the trim threshold. Without it, a cluster whose
      # median walking distance is itself huge (river archipelago) would
      # have ratio × median > 20 km, and no cache would ever exceed
      # that — trim becomes a no-op. 3 km is the empirical default.
      PLANNER_MARGINAL_DROP_HARD_MAX_M: ${PLANNER_MARGINAL_DROP_HARD_MAX_M:-3000}

      # ─── Upload-triggered precompute (M4-β) ─────────────────────────────
      # See docs/design/precompute.md and ADR-0007. These knobs tune the
      # walking-precompute / overpass-refresh jobs and the admin endpoints.
      # The 3 km radius MUST match the runtime walking-graph over-fetch
      # default (min(maxLinkMeters*2, 4000) with maxLinkMeters=1500) so
      # precompute covers exactly what cluster discovery reads.
      PLANNER_PRECOMPUTE_RADIUS_M: ${PLANNER_PRECOMPUTE_RADIUS_M:-3000}
      # Max OSRM /table origins per HTTP call. Higher = fewer round-trips,
      # larger response payloads. 100 origins × ~36 destinations = ~3.6k
      # cells per call — well under OSRM's default response size cap.
      PRECOMPUTE_OSRM_CHUNK_ORIGINS: ${PRECOMPUTE_OSRM_CHUNK_ORIGINS:-100}
      # Beyond this, a 'fresh' cache_precompute_state row is considered
      # stale and eligible for retrigger-stale.
      PRECOMPUTE_STALE_TTL_DAYS: ${PRECOMPUTE_STALE_TTL_DAYS:-30}
      # Caches per retrigger-stale chunked job. Bounds individual job
      # runtime so the operator dashboard updates promptly during a sweep.
      PRECOMPUTE_RETRIGGER_CHUNK: ${PRECOMPUTE_RETRIGGER_CHUNK:-50}

      # ─── Raw GPX upload storage ─────────────────────────────────────────
      # Where the gzipped original .gpx files are persisted so the admin
      # reprocess endpoint can re-parse them after the parser learns about
      # new fields (without forcing users to re-upload). See the
      # `gctp_uploads` named volume below.
      UPLOADS_DIR: ${UPLOADS_DIR:-/srv/uploads}
    volumes:
      # Read-only mount of the OSRM data volume so the API can read
      # /osrm-meta/osrm-version.txt without an extra IPC channel to the
      # OSRM container (osrm-routed has no /info endpoint).
      - osrm-data:/osrm-meta:ro
      # Raw GPX uploads — kept across container restarts and deploys so
      # `POST /admin/uploads/:id/reprocess` can re-parse historical
      # uploads after a parser update. Back up this volume alongside the
      # Postgres dump.
      - gctp-uploads:/srv/uploads

  jobs:
    build:
      context: ..
      dockerfile: infra/Dockerfile.jobs
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # Same schema-version requirement as the api.
      migrate:
        condition: service_completed_successfully
    environment:
      # Same UAT override as api — jobs stub doesn't have the auth guard
      # today but stays consistent with the rest of the stack.
      NODE_ENV: uat
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL}
      LOG_LEVEL: ${LOG_LEVEL}

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        # VITE_API_URL is baked into the static bundle at build time. For the
        # UAT deployment it MUST be the public api URL because the browser
        # makes the request, not the container.
        VITE_API_URL: ${VITE_API_URL}
        # Turnstile site key (public) — baked in so /register shows the captcha.
        # Pair with TURNSTILE_SECRET on the api (FR-P5, Gate 1.4).
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      - api
    networks:
      - default
    # web is the stack's single origin: serves the SPA and reverse-proxies
    # `/api/*` to the api (see infra/nginx.conf). No host ports — the
    # dedicated cloudflared tunnel below is the only way in.

  # Dedicated Cloudflare Tunnel for gctp (ADR-0015). Runs its OWN tunnel
  # (its own connector token) and joins ONLY gctp's network, so gctp shares no
  # network with any other workload. The public
  # hostname route (<app-host> -> http://web:80) and the Cloudflare
  # Access policy are configured in the Cloudflare Zero Trust dashboard; TLS
  # terminates at the Cloudflare edge, so no Let's Encrypt cert lives on-box.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gctp-cloudflared
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
    networks:
      - default

volumes:
  pgdata: {}
  valkey-data: {}
  osrm-data: {}
  # osm2pgsql --flat-nodes file (~150 MB for NL). Persisted across re-imports
  # so the import service can find the node-id → location mapping it built
  # last time — required by osm2pgsql-replication update.
  osm2pgsql-data: {}
  # Raw user-uploaded .gpx files (gzipped, one per upload id). The api
  # mounts this at /srv/uploads; admin reprocess reads from here. Back
  # up alongside pgdata — losing this volume means losing the ability to
  # reprocess old uploads (the parsed cache data in Postgres is intact).
  gctp-uploads: {}
