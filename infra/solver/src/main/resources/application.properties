server.port=8080

# Actuator — only health, exposed unauthenticated for the compose healthcheck.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Timefold determinism + termination caps.
# The seed pins the move-selector RNG so identical input yields identical output.
# Override per environment via SOLVER_SEED env var.
timefold.solver.random-seed=${SOLVER_SEED:42}
# Best-effort wall-clock cap on a single solve. Nest applies its own outer
# 10s HTTP timeout; the solver should always finish well before that.
timefold.solver.termination.spent-limit=${SOLVER_SPENT_LIMIT:5s}

# Single-thread solve — Constraint Streams are deterministic only on one move
# thread; multi-threaded solving would lose the seed guarantee.
timefold.solver.move-thread-count=NONE

logging.level.ai.timefold=INFO
