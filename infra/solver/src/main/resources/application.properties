server.port=8080

# Actuator — only health, exposed unauthenticated for the compose healthcheck.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Timefold determinism + termination caps.
#
# REPRODUCIBLE mode pins the RNG and disables parallelism that would otherwise
# perturb move ordering, so identical input yields identical output across runs.
# That's the Timefold-blessed way to get determinism — `random-seed` is not
# exposed as a Spring property and would need solverConfig.xml.
timefold.solver.environment-mode=REPRODUCIBLE
# Termination: stop as soon as the score stops improving for
# SOLVER_UNIMPROVED_LIMIT (default 500ms) — for a 10-cache cluster the solver
# typically exits in well under a second; for a 50-cache cluster it'll keep
# searching as long as it finds improvements. spent-limit is the hard ceiling
# so a pathological case can't run forever. Whichever fires first wins.
#
# Nest applies its own outer 10s HTTP timeout; both caps below sit comfortably
# inside it.
timefold.solver.termination.unimproved-spent-limit=${SOLVER_UNIMPROVED_LIMIT:500ms}
timefold.solver.termination.spent-limit=${SOLVER_SPENT_LIMIT:5s}

logging.level.ai.timefold=INFO
