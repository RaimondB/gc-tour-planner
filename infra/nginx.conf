server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text responses. Critical for /api/* JSON: a wide /caches query is
  # ~1.8 MB of JSON that otherwise crosses the Cloudflare tunnel hop (the host's
  # home uplink) uncompressed. gzip takes it to ~240 KB (−87%). `gzip_proxied
  # any` is required — nginx does NOT compress upstream (api) responses by
  # default. The SPA's JS/CSS benefit too.
  gzip on;
  gzip_proxied any;
  gzip_types application/json application/geo+json application/javascript text/css text/plain image/svg+xml application/manifest+json;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_vary on;

  # GPX upload bodies: match the API's 64 MB cap (MAX_GPX_BYTES). nginx
  # defaults to 1 MB and would 413 a real "My Finds" Pocket Query; nginx is
  # the edge now, so it must allow the large body itself.
  client_max_body_size 64m;

  # Same-origin API. Proxy /api/* to the api container, stripping the
  # /api prefix (the api mounts routes at the root: /caches, /gpx/upload,
  # /admin/queues, …). nginx is gctp's single edge, so it owns this prefix
  # strip (ADR-0015).
  # `^~` so the static-asset regex location below can't hijack /api/*.json.
  location ^~ /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Planning/discovery can run longer than nginx's 60 s default.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Deny-list dotfile probes (.git/config, .env, .htaccess, …). These never
  # map to anything we serve, but the SPA fallback below would otherwise answer
  # them with a 200 + index.html — which makes scanners flag the host and keep
  # poking. Return 404 first. Matches any path segment beginning with a dot, so
  # it can't collide with a real client route (none start with `.`).
  location ~ /\. {
    return 404;
  }

  # SPA history-API fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed assets aggressively.
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Don't cache index.html (so new deploys are picked up).
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # The service worker must revalidate on every load. It ends in `.js`, so the
  # `immutable` 30d asset rule above WOULD otherwise pin clients to a stale SW
  # for up to a month — they'd never pick up a new deploy. An exact-match
  # location wins over the regex one, so this takes precedence. (vite-plugin-pwa
  # emits `sw.js`; its hashed `workbox-*.js` runtime stays immutable, correctly.)
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Serve the web manifest with the right content-type and no long-lived cache.
  location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
}
