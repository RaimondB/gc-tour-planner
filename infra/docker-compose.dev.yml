#
# Dev infra for gc-tour-planner. Sister file to docker-compose.yml (UAT).
# DO NOT just `docker compose up` — use scripts/dev.sh, which sets the
# right project name (`-p gctp-dev`) and host port mappings (shifted by
# +10000 vs UAT so they never clash with a running UAT stack on the
# same machine).
#
# What's here vs UAT:
#   * Project name : gctp-dev (not gctp)
#   * Services     : postgres, valkey ONLY. api/web/jobs/solver are NOT
#                    started — scripts/dev.sh runs api+web on the host
#                    for hot reload. OSRM is also NOT started: dev shares
#                    UAT's already-running OSRM at host:5000 (read-only
#                    HTTP calls, no data risk) — running a second OSRM
#                    OOMs the host (NL-foot extract peaks at ~5-6 GiB).
#   * Host ports   : shifted via the *_PORT_DEV env vars (defaults
#                    15432 / 16379). Container-internal ports unchanged.
#   * Volumes      : pgdata-dev, valkey-data-dev — fully separate from
#                    the UAT pgdata / valkey-data so wiping dev state
#                    can never touch UAT.
#   * No proxy     : no reverse-proxy labels; dev never goes through the
#                    public edge — it's local-only on shifted host ports.

name: gctp-dev

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    # Docker's default container /dev/shm is 64 MiB — Postgres parallel
    # workers blow through that on any non-trivial PostGIS query.
    shm_size: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER_DEV:-gctp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEV:-gctp-dev}
      POSTGRES_DB: ${POSTGRES_DB_DEV:-gctp_dev}
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_DEV:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_DEV:-gctp} -d ${POSTGRES_DB_DEV:-gctp_dev}"]
      interval: 3s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data-dev:/data
    ports:
      - "${VALKEY_PORT_DEV:-16379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # NOTE: no osrm / osm-prep here. Dev points OSRM_URL at UAT's
  # already-running osrm on host:5000 — see scripts/dev.sh. Running a
  # second OSRM instance OOMs the host (NL-foot extract peaks at
  # ~5-6 GiB during partition/customize and the UAT one already holds
  # 8 GiB of the host's 16 GiB). The dev api stamps route_legs rows with
  # osrm_version='unknown' (it can't read UAT's /osrm-meta file from the
  # host), which keeps the dev cache cleanly namespaced from UAT's.

volumes:
  pgdata-dev: {}
  valkey-data-dev: {}
